name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check browser workflow regressions
        run: node --test tests/test_workbench_ui.cjs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,channel,web]"
      - name: Run tests and coverage gate
        run: python -m pytest
      - name: Audit tracked release content
        run: python scripts/release_audit.py --staged

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Audit built archives
        run: python scripts/release_audit.py --archive dist/*.whl --archive dist/*.tar.gz
      - name: Install wheel in an isolated environment
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install dist/*.whl
      - name: Run installed wheel smoke test
        run: .smoke-venv/bin/python -m cutting_layout run examples/minimal.json --output smoke-output
