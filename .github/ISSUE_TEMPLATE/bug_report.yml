name: Bug report
description: Report a reproducible problem using sanitized, fictional data only
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach customer drawings, real orders, personal information, credentials, or production data.**
        Reproduce the issue with the smallest fictional input possible.
  - type: input
    id: version
    attributes:
      label: cutting-layout version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true
  - type: textarea
    id: sanitized-input
    attributes:
      label: Sanitized minimal input
      description: Paste only fictional JSON or provide steps based on examples/minimal.json.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirmed that this report contains no customer drawings, real orders, personal information, or secrets.
          required: true
