[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cutting-layout"
version = "0.2.0"
description = "Deterministic rectangular sheet-cutting layouts with validated multi-format exports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "cutting-layout contributors", email = "contributors@users.noreply.github.com"},
]
keywords = ["cutting", "nesting", "sheet-metal", "dxf", "manufacturing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ezdxf>=1.4,<2",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=3.7,<5",
  "pypdf>=5,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
cutting-layout = "cutting_layout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutting_layout = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cutting_layout --cov-branch --cov-report=term-missing --cov-fail-under=85"
